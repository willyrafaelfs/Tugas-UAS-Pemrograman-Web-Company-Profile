image: php:8.2-cli

stages:
  - deploy

variables:
  PAGE_BASE_URL: https://willyrafaelfs.gitlab.io/Tugas-UAS-Pemrograman-Web-Company-Profile/

pages:
  stage: deploy
  timeout: 20m
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl libicu-dev libonig-dev libsqlite3-dev libzip-dev
    - docker-php-ext-install intl mbstring sqlite3 zip
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - EXPECTED_CHECKSUM="$(curl -fsSL https://composer.github.io/installer.sig)"
    - php -r "if (hash_file('sha384', '/tmp/composer-setup.php') !== '${EXPECTED_CHECKSUM}') { fwrite(STDERR, 'Invalid Composer installer checksum.' . PHP_EOL); exit(1); }"
    - php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
    - composer install --no-dev --no-interaction --no-progress --prefer-dist
    - |
      cat > .env <<EOF
      CI_ENVIRONMENT = development
      app.baseURL = '${PAGE_BASE_URL}'
      database.default.database = '${CI_PROJECT_DIR}/writable/pages.sqlite'
      database.default.DBDriver = SQLite3
      EOF
  script:
    - php spark migrate
    - php -S 127.0.0.1:8080 -t public > /tmp/company-profile-php.log 2>&1 &
    - |
      for attempt in $(seq 1 30); do
        if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
          break
        fi
        sleep 2
      done
      curl --fail --silent http://127.0.0.1:8080/ > /dev/null
      php scripts/build-pages.php http://127.0.0.1:8080/
  pages:
    publish: pages-build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
