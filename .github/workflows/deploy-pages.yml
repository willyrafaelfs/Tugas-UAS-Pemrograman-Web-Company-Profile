name: Deploy static preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: company_profile
          MYSQL_USER: company_profile
          MYSQL_PASSWORD: company_profile
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PAGE_BASE_URL: https://willyrafaelfs.github.io/Tugas-UAS-Pemrograman-Web-Company-Profile/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, mbstring, mysqli, zip
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist

      - name: Configure application
        run: |
          cat > .env <<EOF
          CI_ENVIRONMENT = development
          app.baseURL = '${PAGE_BASE_URL}'
          database.default.hostname = 127.0.0.1
          database.default.database = company_profile
          database.default.username = company_profile
          database.default.password = company_profile
          database.default.DBDriver = MySQLi
          database.default.port = 3306
          EOF

      - name: Run database migrations
        run: php spark migrate

      - name: Generate the static site
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/company-profile-php.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          php scripts/build-pages.php http://127.0.0.1:8080/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
